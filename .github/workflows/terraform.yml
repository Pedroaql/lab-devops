name: Terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: terraform-projeto
    steps:
      - uses: actions/checkout@v4
      - name: Terraform Plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          terraform init
          terraform plan

  apply:
    if: github.event_name == 'push'
    runs-on: self-hosted
    environment: production
    defaults:
      run:
        working-directory: terraform-projeto
    steps:
      - uses: actions/checkout@v4
      - name: Terraform Apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          terraform init
          terraform apply -auto-approve
